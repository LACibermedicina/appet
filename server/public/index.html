  const romance=S.mMode==='romance';const d=deck();const top=d[0];
  return `<div class="mmode"><button data-mm="amizade" class="${!romance?'on':''}">🐾 Amizade</button><button data-mm="romance" class="${romance?'on':''}">💘 Algo mais</button></div>
  <div class="tabs" style="margin:0 auto 12px"><button data-mtb="swipe" class="${mTab==='swipe'?'on':''}">Descobrir</button><button data-mtb="list" class="${mTab==='list'?'on':''}">Matches (${S.matches.length})</button></div>
  ${mTab==='list'?(S.matches.length?`<div class="card list">${S.matches.map(m=>{const c=CANDS.find(x=>x.id===m.id);return `<div class="li"><div class="av2" style="background:${c.g}">${c.e}</div><div class="grow"><b>${c.n} ${m.mode==='romance'?'💘':'🐾'}</b><div class="mut">${c.b} · ${c.k} km · ${m.plan||'sem encontro marcado'}</div></div><button class="btn s sm" data-chat="${c.id}">Conversar</button><button class="btn p sm" data-date="${c.id}">Marcar encontro</button></div>`}).join('')}</div>`:'<div class="empty">Ainda sem matches. Dê umas patinhas em Descobrir!</div>')
  :`${romance?`<div class="respons">💘 <b>Algo mais, com responsabilidade.</b> ${S.chip.neutered?`Como o ${S.pet.name} é castrado, aqui você encontra um par fixo de companhia e passeios.`:'Para cruzamento, só aparecem pets com vacinas em dia e não castrados. Exigimos avaliação veterinária dos dois e acordo entre tutores. Se vocês não planejam filhotes, considere a castração.'}</div>
    <div class="row" style="justify-content:center;margin-bottom:10px;gap:6px"><span class="mut">O ${S.pet.name} é</span><button class="chip" data-sex="M" style="${S.petSex==='M'?'background:var(--violet);color:#fff':''}">macho</button><button class="chip" data-sex="F" style="${S.petSex==='F'?'background:var(--violet);color:#fff':''}">fêmea</button></div>`:''}
   <div class="deck" id="deck">${top?d.slice(0,3).reverse().map((c,i,arr)=>{const isTop=c===top;const depth=arr.length-1-i;return `<div class="mcard" data-c="${c.id}" style="background:${c.g};transform:translateY(${depth*10}px) scale(${1-depth*.04});${isTop?'':'pointer-events:none'}">
      <div class="art">${c.e}</div><span class="cmp">${compat(c)}% compatível</span><span class="stamp like">PATA!</span><span class="stamp nope">PASSO</span>
      <div class="info"><div class="nm">${c.n}, ${c.a}</div><div style="opacity:.9;font-size:13px">${c.b} · ${c.sx==='F'?'fêmea':'macho'} · ${c.k} km · energia ${c.en.toLowerCase()}</div><div style="font-size:13px;margin-top:6px">${c.bio}</div>
      <div class="tg">${c.tags.map(t=>`<span>${t}</span>`).join('')}${c.vac?'<span>💉 vacinado</span>':'<span>⚠️ vacinas pendentes</span>'}${c.cast?'<span>castrado</span>':''}</div>
      ${isTop&&whyTxt[c.id]?`<div style="margin-top:8px;font-size:12px;background:rgba(255,255,255,.18);border-radius:10px;padding:8px">✨ ${esc(whyTxt[c.id])}</div>`:''}</div></div>`}).join('')
     :`<div class="empty" style="padding-top:120px">Você viu todos por aqui 🐾<br><button class="btn s sm" style="margin-top:10px" id="mReset">Recomeçar</button></div>`}</div>
   ${top?`<div class="mbtns"><button id="mNo" title="Passar">✕</button><button class="sp" id="mWhy" title="Por que combinam?">✨</button><button class="sp" id="mSup" title="Super pata (5 créditos)">⭐</button><button id="mYes" title="Dar pata">💜</button></div><p class="mut" style="text-align:center;margin-top:8px;font-size:12px">Arraste o cartão ou use os botões · ✨ a IA explica a compatibilidade · ⭐ super pata custa 5 créditos</p>`:''}`}
  ${matchShow?`<div class="itsmatch"><h2>É um match!</h2><div class="pair"><div style="${S.photo?`background-image:url(${S.photo})`:''}">${S.photo?'':S.pet.emoji}</div><span class="heart">${matchShow.mode==='romance'?'💘':'🐾'}</span><div style="background:${matchShow.c.g}">${matchShow.c.e}</div></div><p>${S.pet.name} e ${matchShow.c.n} ${matchShow.mode==='romance'?'deram aquela olhadinha 😍':'querem ser amigos!'}</p>
    <div class="row" style="flex-wrap:wrap;justify-content:center"><button class="btn sm" style="background:#fff;color:var(--violet)" id="mmDate">📅 Marcar encontro no parque</button><button class="btn sm" style="background:rgba(255,255,255,.2);color:#fff" id="mmChat">💬 Conversar</button><button class="btn sm" style="background:transparent;color:#fff" id="mmClose">Continuar</button></div></div>`:''}`;
};
function decide(c,like,sup){
  S.seen[S.mMode+c.id]=like?'like':'nope';
  if(like&&(c.likes||sup)){S.matches.unshift({id:c.id,mode:S.mMode});matchShow={c,mode:S.mMode};addXP(5,`Match com ${c.n}!`)}
  rerender('match');
}
B.match=b=>{
  $$('[data-mm]',b).forEach(x=>x.onclick=()=>{S.mMode=x.dataset.mm;rerender('match')});
  $$('[data-mtb]',b).forEach(x=>x.onclick=()=>{mTab=x.dataset.mtb;rerender('match')});
  $$('[data-sex]',b).forEach(x=>x.onclick=()=>{S.petSex=x.dataset.sex;rerender('match')});
  const rs=$('#mReset',b);if(rs)rs.onclick=()=>{Object.keys(S.seen).filter(k=>k.startsWith(S.mMode)).forEach(k=>delete S.seen[k]);rerender('match')};
  const top=deck()[0];
  if(top&&mTab==='swipe'){
    const card=$(`.mcard[data-c="${top.id}"]`,b);let on=false,sx=0,dx=0;
    const fly=like=>{card.style.transform=`translateX(${like?600:-600}px) rotate(${like?30:-30}deg)`;card.style.opacity=0;setTimeout(()=>decide(top,like),280)};
    card.addEventListener('pointerdown',e=>{on=true;sx=e.clientX;dx=0;card.style.transition='none';card.setPointerCapture(e.pointerId)});
    card.addEventListener('pointermove',e=>{if(!on)return;dx=e.clientX-sx;card.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;$('.like',card).style.opacity=clamp(dx/100,0,1);$('.nope',card).style.opacity=clamp(-dx/100,0,1)});
    card.addEventListener('pointerup',()=>{if(!on)return;on=false;card.style.transition='';if(Math.abs(dx)>100)fly(dx>0);else{card.style.transform='';$('.like',card).style.opacity=0;$('.nope',card).style.opacity=0}});
    $('#mYes',b).onclick=()=>fly(true);$('#mNo',b).onclick=()=>fly(false);
    $('#mSup',b).onclick=()=>{if(spend(5,'Super pata para '+top.n)){card.style.transform='translateY(-600px)';card.style.opacity=0;setTimeout(()=>decide(top,true,true),280)}};
    $('#mWhy',b).onclick=async()=>{const w=$('#mWhy',b);w.textContent='…';
      const r=await askAI(`Em no máximo 30 palavras, em português, explique de forma divertida por que ${S.pet.name} (${S.pet.breed}, ${S.pet.age}, energia ${S.pet.energy}) e ${top.n} (${top.b}, ${top.a}, energia ${top.en}, ${top.tags.join(', ')}) combinariam para ${S.mMode==='romance'?'um par':'uma amizade'}. Termine com uma sugestão de primeiro encontro.`,{fallback:()=>`Energia ${S.pet.energy.toLowerCase()} com ${top.en.toLowerCase()} e só ${top.k} km de distância. Primeiro encontro: passeio de cheirar no parque com bolinha!`});
      whyTxt[top.id]=r.text;rerender('match')};
  }
  const close=()=>{matchShow=null;rerender('match')};
  const md=$('#mmDate',b);if(md)md.onclick=()=>{const c=matchShow.c;planDate(c);close()};
  const mc=$('#mmChat',b);if(mc)mc.onclick=()=>{const c=matchShow.c;close();chatWith(c)};
  const mx=$('#mmClose',b);if(mx)mx.onclick=close;
  $$('[data-chat]',b).forEach(x=>x.onclick=()=>chatWith(CANDS.find(c=>c.id===x.dataset.chat)));
  $$('[data-date]',b).forEach(x=>x.onclick=()=>{planDate(CANDS.find(c=>c.id===x.dataset.date));rerender('match')});
};
function planDate(c){const m=S.matches.find(x=>x.id===c.id);const when='Sáb 16:00 · Parque da Cidade';if(m)m.plan=when;S.bookings.push({s:`Encontro com ${c.n} ${c.e}`,w:'PetMatch',slot:when,e:'💞'});refreshAll();notify('Encontro marcado 💞',`${S.pet.name} e ${c.n}: ${when}. Lembrete enviado aos dois tutores.`,'match',5000)}
function chatWith(c){S.chat.push({from:c.n,pet:c.e,txt:pick(['Oi! Bora cheirar uns postes juntos? 🐾','Vi seu perfil… gostei do seu focinho 😄','Topa um passeio no sábado?']),type:'brincar'});openApp('interakao');rerender('interakao')}

/* =========================================================
   CONTAS: cada pessoa só vê os próprios dados
   ========================================================= */
async function api(path,opts={}){
  const o={credentials:'same-origin',...opts,headers:{'content-type':'application/json',...(opts.headers||{})}};
  if(o.body&&typeof o.body!=='string')o.body=JSON.stringify(o.body);
  const r=await fetch('/api'+path,o);const d=await r.json().catch(()=>({}));
  if(!r.ok)throw Object.assign(new Error(d.error||('Erro '+r.status)),{status:r.status});return d;
}
function applyProfile(p){
  ['onboarded','tutor','goals','time','story','photo','withTutor','bgPhoto','bgTouched','lost','petSex'].forEach(k=>{if(p[k]!==undefined)S[k]=JSON.parse(JSON.stringify(p[k]))});
  S.pet=Object.assign({},PDEF.pet,p.pet||{});S.chip=Object.assign({},PDEF.chip,p.chip||{});
}
async function loadAccount(){
  applyProfile(PDEF);S.stories=[];FEED=[];COMM.stories=[];COMM.reels=[];MYREELS=[];CIRCLES={close:[],groups:[]};
  const {profile}=await api('/me/profile');if(profile)applyProfile(profile);
  if(!profile){S.tutor=ME.name||'';S.pet=Object.assign({},PDEF.pet,{name:'',breed:'',age:''})}
  S._hadPhoto=!!S.photo;
  await loadCommunity();
  applyBg();if(deskOn){renderDesk(new Set(S.active));refreshAll()}
}
async function syncProfile(){
  const p={onboarded:S.onboarded,tutor:S.tutor,pet:S.pet,goals:S.goals,time:S.time,story:S.story,withTutor:S.withTutor,bgPhoto:S.bgPhoto,bgTouched:S.bgTouched,lost:S.lost,chip:S.chip,petSex:S.petSex};
  try{
    await api('/me/profile',{method:'PUT',body:p});
    if(S.photo&&S.photo.startsWith('data:')){const d=S.photo;const r=await api('/me/photo',{method:'PUT',body:{image:d}});if(S.photo===d)S.photo=r.photo}
    else if(!S.photo&&S._hadPhoto){await api('/me/photo',{method:'PUT',body:{image:null}})}
    S._hadPhoto=!!S.photo;
  }catch(e){notify('Não foi possível salvar',e.message,'perfil',4500)}
}
function openAuth(done){
  let mode='login',vals={n:'',e:'',p:''};
  const w=document.createElement('div');w.className='modalwrap';document.body.appendChild(w);
  const draw=(err='',busy=false)=>{
    w.innerHTML=`<div class="modal" style="width:min(420px,100%)"><div class="between"><span class="logo"><span class="pawmark">🐾</span>APPET</span><button class="btn g sm" id="aX">✕</button></div>
      <h2 style="margin-top:14px">${mode==='login'?'Entrar':'Criar conta'}</h2><p class="m">Tudo o que você cadastra fica só na sua conta. Ninguém mais vê, a não ser o que você publicar para a comunidade.</p>
      <div class="tabs"><button data-am="login" class="${mode==='login'?'on':''}">Entrar</button><button data-am="register" class="${mode==='register'?'on':''}">Criar conta</button></div>
      <form id="aF">${mode==='register'?`<div class="f"><label>Seu nome</label><input id="aN" autocomplete="name" value="${esc(vals.n)}"></div>`:''}
       <div class="f"><label>E-mail</label><input id="aE" type="email" autocomplete="email" required value="${esc(vals.e)}"></div>
       <div class="f"><label>Senha${mode==='register'?' (mínimo 8 caracteres)':''}</label><input id="aP" type="password" autocomplete="${mode==='login'?'current-password':'new-password'}" minlength="8" required></div>
       ${err?`<p style="color:#c02a2a;font-size:13px;margin-bottom:10px">${esc(err)}</p>`:''}
       <button class="btn p" style="width:100%;justify-content:center" ${busy?'disabled':''}>${busy?'Aguarde…':mode==='login'?'Entrar':'Criar conta'}</button></form></div>`;
    $('#aX',w).onclick=()=>w.remove();
    $$('[data-am]',w).forEach(b=>b.onclick=()=>{mode=b.dataset.am;draw()});
    $('#aF',w).onsubmit=async e=>{e.preventDefault();
      vals={n:($('#aN',w)||{}).value||'',e:$('#aE',w).value.trim(),p:$('#aP',w).value};
      draw('',true);
      try{const d=await api('/auth/'+mode,{method:'POST',body:{name:vals.n,email:vals.e,password:vals.p}});ME=d.user;await loadAccount();w.remove();
        notify(mode==='login'?'Bem-vindo de volta 🐾':'Conta criada 🎉',`Conectado como ${ME.email}. Seus dados ficam só na sua conta.`,'perfil',4500);done&&done()}
      catch(err){draw(err.message)}
    };
    setTimeout(()=>{const i=$(mode==='register'?'#aN':'#aE',w);if(i&&!i.value)i.focus()},50);
  };
  draw();
}
async function accountAction(){
  if(SERVER&&ME){try{await api('/auth/logout',{method:'POST'})}catch(e){}}
  else if(SERVER){openAuth(()=>{if(!deskOn)return;loadAccount()});return}
  try{['appet-profile','appet-loop','appet-loop-pos'].forEach(k=>localStorage.removeItem(k))}catch(e){}
  location.reload();
}
async function initServer(){
  try{const r=await fetch('/api/health',{cache:'no-store'});if(!r.ok)return;const h=await r.json();if(!h||h.ok!==true)return}catch(e){return}
  SERVER=true;API_BASE='/api';
  // sem conta, nada fica guardado no aparelho: limpa dados antigos que outra pessoa possa ter deixado
  try{localStorage.removeItem('appet-profile')}catch(e){}
  applyProfile(PDEF);S.stories=[];applyBg();
  try{const d=await api('/auth/me');if(d.user){ME=d.user;await loadAccount()}}catch(e){}
  buildHomeLoop();
}
function postComposer(file,kind){
  const isVid=file.type.startsWith('video/');
  if(isVid&&file.size>60*1024*1024){notify('Vídeo muito grande','O limite é 60 MB. Corte ou comprima o vídeo e tente de novo.','reels',4500);return}
  const open=src=>{const st={vis:'public',groups:new Set()};
    const w=document.createElement('div');w.className='modalwrap';document.body.appendChild(w);
    w.innerHTML=`<div class="modal" style="width:min(460px,100%)"><h2>${kind==='reel'?'Novo reel':'Novo story'}</h2>
      ${isVid?`<video src="${src}" controls playsinline style="width:100%;max-height:260px;border-radius:16px;background:#000;margin:12px 0"></video>`:`<div class="photodrop" style="height:240px;background-image:url(${src});margin:12px 0;cursor:default"></div>`}
      <div class="f"><label>Legenda</label><input id="stT" maxlength="220" value="${kind==='reel'?'':`Dia de aventura do ${esc(S.pet.name||'meu pet')} 🐾`}" placeholder="Conte o que está acontecendo… use palavras que ajudem na busca"></div>
      <div class="audbox"></div>
      <div class="mact"><button class="btn g" id="stC">Cancelar</button><button class="btn p" id="stP">Publicar</button></div></div>`;
    bindAud($('.audbox',w),st);
    $('#stC',w).onclick=()=>w.remove();
    $('#stP',w).onclick=async()=>{if(!audValid(st))return;const vis=st.vis;const t=$('#stT',w).value.trim();const btn=$('#stP',w);btn.disabled=true;btn.textContent='Enviando…';
      try{
        let post;
        if(SERVER&&ME){
          const blob=isVid?file:await (await fetch(src)).blob();
          const qs=new URLSearchParams({kind,visibility:vis,text:t,groups:[...st.groups].join(',')});
          const r=await fetch('/api/me/posts?'+qs,{method:'POST',credentials:'same-origin',headers:{'content-type':blob.type||'application/octet-stream'},body:blob});
          const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||('Erro '+r.status));post=d.post;
        }else post={id:'loc'+Date.now(),local:true,kind,url:src,mediaType:isVid?'video':'image',text:t,visibility:vis,audience:localAudience(st),petName:S.pet.name,petEmoji:S.pet.emoji,createdAt:new Date().toISOString(),mine:true,reactions:{},myReaction:null};
        if(kind==='story')S.stories.unshift(asStory(post));
        else{MYREELS.unshift(post);if(vis!=='private')COMM.reels.unshift(post);reelTab=vis!=='private'?'comunidade':'meus'}
        idxPosts();w.remove();rerender('reels');
        if(!S.storyXP){S.storyXP=1;addXP(10,kind==='reel'?'Primeiro reel publicado!':'Primeiro story publicado!')}
        notify(kind==='reel'?'Reel publicado':'Story publicado',`Quem vê: ${AUD[vis].e} ${AUD[vis].n}`,'reels',3000);
      }catch(e){btn.disabled=false;btn.textContent='Publicar';notify('Não foi possível publicar',e.message,'reels',4500)}
    };
  };
  if(isVid)open(URL.createObjectURL(file));else loadPhoto(file,d=>{if(d)open(d)});
}

applyBg();
buildHome();
const serverReady=initServer();
