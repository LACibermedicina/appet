<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APPET — o sistema do seu pet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1d1b3a; --ink2:#5b5878; --ink3:#9a97b4;
  --glass:rgba(255,255,255,.72); --glass2:rgba(255,255,255,.55);
  --line:rgba(30,20,80,.08);
  --pink:#ff6fa8; --orange:#ff9f43; --yellow:#ffd93d; --mint:#2ed8a3; --sky:#3fa9ff; --violet:#8b5cf6; --coral:#ff6b6b;
  --r:16px;
  --shadow:0 24px 70px rgba(50,30,120,.22),0 0 0 .5px rgba(0,0,0,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:#fbf7ff;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.hidden{display:none!important}

/* ---------- animated background ---------- */
#bg{position:fixed;inset:0;overflow:hidden;z-index:0;background:linear-gradient(135deg,#fff6fb 0%,#f3f0ff 45%,#eefaff 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;animation:float 18s ease-in-out infinite}
.b1{width:46vmax;height:46vmax;background:#ffb3d1;left:-10vmax;top:-12vmax}
.b2{width:40vmax;height:40vmax;background:#c7b6ff;right:-12vmax;top:5vmax;animation-delay:-6s}
.b3{width:38vmax;height:38vmax;background:#a8f0d8;left:20vmax;bottom:-18vmax;animation-delay:-11s}
.b4{width:26vmax;height:26vmax;background:#ffe08a;right:18vmax;bottom:-6vmax;animation-delay:-3s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(4vmax,3vmax) scale(1.08)}66%{transform:translate(-3vmax,2vmax) scale(.95)}}
.paws{position:absolute;inset:0;opacity:.07;background-image:radial-gradient(circle at 20px 20px,#3a2a7a 3px,transparent 4px),radial-gradient(circle at 30px 12px,#3a2a7a 2.5px,transparent 3.5px),radial-gradient(circle at 10px 12px,#3a2a7a 2.5px,transparent 3.5px);background-size:120px 120px}

/* ---------- app icon ---------- */
.ai{width:56px;height:56px;border-radius:15px;display:grid;place-items:center;font-size:29px;position:relative;
  box-shadow:0 8px 18px rgba(40,20,100,.18),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 0 rgba(0,0,0,.08);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.ai::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 50%)}

/* ---------- HOME ---------- */
#home{position:fixed;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;transition:opacity .6s,transform .6s}
#home.leave{opacity:0;transform:scale(1.06);pointer-events:none}
#orbit{position:absolute;inset:0;pointer-events:none}
.orb{position:absolute;pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:6px;transform:translate(-50%,-50%);animation:bob 6s ease-in-out infinite}
.orb .lbl{font-size:12px;font-weight:600;color:var(--ink2);background:rgba(255,255,255,.7);padding:2px 8px;border-radius:99px;opacity:.0;transition:.2s;white-space:nowrap}
.orb:hover .ai{transform:scale(1.18) rotate(-4deg)}
.orb:hover .lbl{opacity:1}
@keyframes bob{0%,100%{margin-top:0}50%{margin-top:-10px}}
.center{position:relative;z-index:3;width:min(640px,92vw);text-align:center}
.logo{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:15px;letter-spacing:.18em;color:var(--violet);background:rgba(255,255,255,.7);padding:6px 14px 6px 8px;border-radius:99px;box-shadow:0 4px 16px rgba(100,60,200,.12)}
.logo .pawmark{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--violet));display:grid;place-items:center;font-size:14px}
h1.hello{font-size:clamp(30px,5.4vw,54px);line-height:1.05;font-weight:800;margin:18px 0 10px;letter-spacing:-.03em}
h1.hello em{font-family:Fraunces,serif;font-style:italic;font-weight:400;background:linear-gradient(90deg,var(--pink),var(--violet),var(--sky));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--ink2);font-size:16px;margin-bottom:26px}
.prompt{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.88);backdrop-filter:blur(20px);border-radius:22px;padding:10px 10px 10px 18px;box-shadow:0 20px 60px rgba(90,50,200,.18),0 0 0 1px rgba(139,92,246,.12);transition:.25s}
.prompt:focus-within{box-shadow:0 24px 70px rgba(90,50,200,.28),0 0 0 3px rgba(139,92,246,.25)}
.prompt input{flex:1;border:0;outline:0;background:transparent;font-size:17px;padding:10px 0;min-width:0}
.prompt .go{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,var(--pink),var(--violet));color:#fff;font-size:20px;display:grid;place-items:center;box-shadow:0 8px 20px rgba(139,92,246,.4);transition:.2s}
.prompt .go:hover{transform:scale(1.06)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.chip{background:rgba(255,255,255,.72);padding:8px 13px;border-radius:99px;font-size:13px;font-weight:600;color:var(--ink2);box-shadow:0 2px 8px rgba(60,40,140,.06);transition:.2s}
.chip:hover{background:#fff;color:var(--violet);transform:translateY(-2px)}
.hint{margin-top:22px;font-size:12px;color:var(--ink3)}

/* ---------- ONBOARDING ---------- */
.modalwrap{position:fixed;inset:0;z-index:60;background:rgba(40,20,90,.22);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.modal{width:min(620px,100%);max-height:92vh;overflow:auto;background:rgba(255,255,255,.94);border-radius:24px;box-shadow:var(--shadow);padding:26px;animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.modal h2{font-size:22px;letter-spacing:-.02em}
.modal p.m{color:var(--ink2);font-size:14px;margin:4px 0 18px}
.steps{display:flex;gap:6px;margin-bottom:16px}.steps i{height:5px;flex:1;border-radius:9px;background:#ece8f8}.steps i.on{background:linear-gradient(90deg,var(--pink),var(--violet))}
.f{display:grid;gap:6px;margin-bottom:14px}.f label{font-size:12px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
.f input,.f textarea,.f select{border:1px solid var(--line);background:#faf9ff;border-radius:12px;padding:11px 13px;outline:0;font-size:15px}
.f input:focus,.f textarea:focus{border-color:var(--violet);background:#fff}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{padding:8px 12px;border-radius:99px;background:#f2effb;font-size:13px;font-weight:600;color:var(--ink2);transition:.15s}
.pick button.on{background:linear-gradient(135deg,var(--pink),var(--violet));color:#fff;box-shadow:0 6px 14px rgba(139,92,246,.3)}
.avatars button{font-size:24px;width:46px;height:46px;border-radius:14px;padding:0}
.range{display:flex;align-items:center;gap:12px}.range input{flex:1;accent-color:var(--violet)}.range b{min-width:70px;text-align:right}
.mact{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.btn{padding:11px 18px;border-radius:12px;font-weight:700;font-size:14px;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn.p{background:linear-gradient(135deg,var(--pink),var(--violet));color:#fff;box-shadow:0 8px 18px rgba(139,92,246,.3)}
.btn.p:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn.s{background:#f1eefb;color:var(--ink)}.btn.s:hover{background:#e7e2fa}
.btn.g{color:var(--ink2)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45;pointer-events:none}

/* ---------- DESKTOP ---------- */
#desk{position:fixed;inset:0;z-index:1;opacity:0;pointer-events:none;transition:opacity .6s .15s}
#desk.on{opacity:1;pointer-events:auto}
.menubar{position:absolute;top:0;left:0;right:0;height:30px;background:rgba(255,255,255,.55);backdrop-filter:blur(24px) saturate(1.8);display:flex;align-items:center;padding:0 10px;gap:2px;font-size:13px;z-index:50;box-shadow:0 .5px 0 rgba(0,0,0,.08)}
.menubar .mi{padding:3px 9px;border-radius:6px;font-weight:500}
.menubar .mi:hover,.menubar .mi.open{background:rgba(0,0,0,.07)}
.menubar .mi.brand{font-weight:800;display:flex;align-items:center;gap:6px}
.menubar .sp{flex:1}
.menubar .st{display:flex;align-items:center;gap:6px;padding:3px 8px;border-radius:6px;font-weight:600;white-space:nowrap}
.menubar .st:hover{background:rgba(0,0,0,.07)}
.lvl{background:linear-gradient(135deg,var(--yellow),var(--orange));color:#5a3200;font-size:11px;padding:2px 7px;border-radius:99px;font-weight:800}
.drop{position:absolute;top:30px;background:rgba(255,255,255,.92);backdrop-filter:blur(24px);border-radius:10px;box-shadow:var(--shadow);padding:5px;min-width:220px;z-index:80;font-size:13px}
.drop button{display:flex;width:100%;justify-content:space-between;padding:6px 10px;border-radius:6px;text-align:left}
.drop button:hover{background:var(--violet);color:#fff}
.drop hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.drop kbd{opacity:.5;font-family:inherit}

#icons{position:absolute;top:44px;right:14px;bottom:100px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,96px);grid-auto-columns:92px;gap:4px;direction:rtl;z-index:2}
.dicon{direction:ltr;display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 2px;border-radius:12px;animation:popIn .5s cubic-bezier(.2,1.5,.4,1) backwards}
.dicon .ai{width:54px;height:54px;font-size:27px}
.dicon span{font-size:12px;font-weight:600;text-align:center;line-height:1.2;color:var(--ink);text-shadow:0 1px 6px #fff}
.dicon:hover{background:rgba(255,255,255,.45)}
.dicon:hover .ai{transform:scale(1.07)}
@keyframes popIn{from{transform:scale(.3) translateY(30px);opacity:0}}

.deskhello{position:absolute;left:28px;top:52px;z-index:1;max-width:420px}
.deskhello h3{font-size:28px;letter-spacing:-.03em;font-weight:800}
.deskhello p{color:var(--ink2);font-size:14px;margin-top:4px}
.quickprompt{margin-top:14px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.75);border-radius:14px;padding:8px 8px 8px 14px;box-shadow:0 8px 30px rgba(80,40,180,.12);cursor:text;width:360px;max-width:80vw}
.quickprompt span{flex:1;color:var(--ink3);font-size:14px}
.quickprompt kbd{font-size:11px;background:#f0edf9;padding:3px 7px;border-radius:6px;color:var(--ink2);font-family:inherit;font-weight:700}

/* dock */
.dockwrap{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;z-index:45;pointer-events:none}
.dock{pointer-events:auto;display:flex;align-items:flex-end;gap:6px;padding:8px 10px;background:rgba(255,255,255,.45);backdrop-filter:blur(26px) saturate(1.8);border-radius:22px;box-shadow:0 10px 40px rgba(50,30,120,.18),0 0 0 .5px rgba(255,255,255,.7) inset;max-width:calc(100vw - 20px);overflow-x:auto;scrollbar-width:none}
.dock::-webkit-scrollbar{display:none}
.dk{position:relative;display:flex;flex-direction:column;align-items:center;flex:none}
.dk .ai{width:50px;height:50px;font-size:26px;border-radius:13px;transition:transform .2s cubic-bezier(.3,1.6,.5,1),margin .2s}
.dk:hover .ai{transform:translateY(-10px) scale(1.22)}
.dk .tip{position:absolute;bottom:72px;background:rgba(30,25,60,.85);color:#fff;font-size:12px;padding:4px 9px;border-radius:7px;white-space:nowrap;opacity:0;pointer-events:none;transition:.15s;font-weight:600}
.dk:hover .tip{opacity:1}
.dk .dot{width:4px;height:4px;border-radius:50%;background:var(--ink);margin-top:4px;opacity:0}
.dk.run .dot{opacity:.7}
.dk.bounce .ai{animation:bounce .6s 2}
@keyframes bounce{50%{transform:translateY(-18px)}}
.dsep{width:1px;align-self:stretch;background:rgba(0,0,0,.12);margin:4px 3px;flex:none}

/* windows */
#wins{position:absolute;inset:30px 0 0 0;z-index:10;pointer-events:none}
.win{position:absolute;pointer-events:auto;display:flex;flex-direction:column;background:rgba(255,255,255,.86);backdrop-filter:blur(34px) saturate(1.6);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;animation:winIn .32s cubic-bezier(.2,1.2,.4,1);min-width:320px;min-height:240px}
.win.max{left:6px!important;top:6px!important;width:calc(100% - 12px)!important;height:calc(100% - 96px)!important}
.win.min{animation:winOut .3s forwards}
@keyframes winIn{from{transform:scale(.88) translateY(20px);opacity:0}}
@keyframes winOut{to{transform:scale(.3) translateY(60vh);opacity:0}}
.tb{height:42px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;cursor:grab;user-select:none;border-bottom:1px solid var(--line);background:rgba(255,255,255,.4)}
.tb:active{cursor:grabbing}
.lights{display:flex;gap:7px}
.lights button{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18);position:relative}
.lights .c{background:#ff5f57}.lights .m{background:#febc2e}.lights .x{background:#28c840}
.lights:hover button::after{position:absolute;inset:0;display:grid;place-items:center;font-size:9px;font-weight:800;color:rgba(0,0,0,.5)}
.lights:hover .c::after{content:"×"}.lights:hover .m::after{content:"–"}.lights:hover .x::after{content:"+"}
.tb .tt{flex:1;text-align:center;font-weight:700;font-size:13px;margin-right:52px;display:flex;align-items:center;justify-content:center;gap:7px}
.tb .tt i{font-style:normal}
.wb{flex:1;overflow:auto;padding:18px;position:relative}
.wb::-webkit-scrollbar{width:9px}.wb::-webkit-scrollbar-thumb{background:rgba(0,0,0,.12);border-radius:9px;border:2px solid transparent;background-clip:padding-box}
.rs{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize}

/* notifications */
#notes{position:fixed;top:40px;right:12px;z-index:90;display:flex;flex-direction:column;gap:8px;width:min(360px,calc(100vw - 24px));pointer-events:none}
.note{pointer-events:auto;background:rgba(255,255,255,.9);backdrop-filter:blur(24px);border-radius:16px;box-shadow:0 12px 40px rgba(50,30,120,.2);padding:12px 14px;display:flex;gap:11px;align-items:flex-start;animation:slideIn .45s cubic-bezier(.2,1.3,.4,1);font-size:13px}
.note .ai{width:36px;height:36px;font-size:19px;border-radius:10px;flex:none}
.note b{display:block;font-size:13px;margin-bottom:2px}
.note p{color:var(--ink2);line-height:1.4}
.note.out{animation:slideOut .35s forwards}
@keyframes slideIn{from{transform:translateX(110%)}}
@keyframes slideOut{to{transform:translateX(110%);opacity:0}}

/* spotlight */
#spot{position:fixed;inset:0;z-index:70;background:rgba(40,20,90,.12);backdrop-filter:blur(3px);display:flex;justify-content:center;padding-top:16vh;animation:fade .2s}
#spot .box{width:min(640px,92vw);height:max-content;background:rgba(255,255,255,.92);backdrop-filter:blur(30px);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;animation:pop .3s cubic-bezier(.2,1.3,.4,1)}
#spot .in{display:flex;align-items:center;gap:12px;padding:16px 18px;font-size:20px}
#spot input{flex:1;border:0;outline:0;background:transparent;font-size:20px}
#spot .res{border-top:1px solid var(--line);padding:6px;max-height:44vh;overflow:auto}
#spot .res button{display:flex;align-items:center;gap:12px;width:100%;padding:8px 10px;border-radius:10px;text-align:left;font-size:14px}
#spot .res button .ai{width:32px;height:32px;font-size:17px;border-radius:9px}
#spot .res button.sel,#spot .res button:hover{background:var(--violet);color:#fff}
#spot .res button small{display:block;opacity:.65;font-size:12px}

/* ---------- shared app UI ---------- */
.h{font-size:20px;font-weight:800;letter-spacing:-.02em}
.mut{color:var(--ink2);font-size:13px}
.card{background:#fff;border-radius:var(--r);padding:16px;box-shadow:0 2px 10px rgba(50,30,120,.06),0 0 0 1px var(--line)}
.card.click{cursor:pointer;transition:.2s}.card.click:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(50,30,120,.12),0 0 0 1px var(--line)}
.card h4{font-size:13px;font-weight:700;color:var(--ink2);display:flex;align-items:center;gap:6px;margin-bottom:10px;text-transform:uppercase;letter-spacing:.05em}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.grid.s{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.bar{height:8px;background:#f0edf8;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--mint),var(--sky));transition:width .6s cubic-bezier(.3,1.3,.5,1)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700}
.pill.ok{background:#dcfbef;color:#0c8a5e}.pill.warn{background:#fff1d6;color:#a55d00}.pill.bad{background:#ffe1e1;color:#c02a2a}.pill.v{background:#efe8ff;color:#6a3fd8}.pill.b{background:#e2f1ff;color:#1b6fc2}
.tabs{display:flex;gap:4px;background:#f1eef9;padding:4px;border-radius:12px;margin-bottom:14px;width:max-content;max-width:100%;overflow:auto}
.tabs button{padding:7px 13px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.big{font-size:30px;font-weight:800;letter-spacing:-.03em}
.emo{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:26px;flex:none}
.list>*+*{border-top:1px solid var(--line)}
.li{display:flex;align-items:center;gap:12px;padding:11px 2px}
.li .grow{flex:1;min-width:0}
.li b{font-size:14px}
.sec{margin:20px 0 10px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px}
.gtxt{background:linear-gradient(90deg,var(--pink),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.chk{width:22px;height:22px;border-radius:7px;border:2px solid #d6d0ee;display:grid;place-items:center;flex:none;font-size:13px;color:#fff;transition:.15s}
.chk.on{background:var(--mint);border-color:var(--mint)}

/* dashboard */
.hero{border-radius:20px;padding:20px;color:#fff;background:linear-gradient(120deg,#ff7eb3,#8b5cf6 55%,#3fa9ff);position:relative;overflow:hidden;margin-bottom:14px}
.hero::after{content:"🐾";position:absolute;right:-10px;bottom:-30px;font-size:140px;opacity:.15;transform:rotate(-20deg)}
.hero .av{width:64px;height:64px;border-radius:20px;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:38px;flex:none}
.hero .xp{height:8px;background:rgba(255,255,255,.25);border-radius:9px;margin-top:8px;overflow:hidden}.hero .xp i{display:block;height:100%;background:#fff;border-radius:9px}
.rings{display:flex;flex-wrap:wrap;gap:14px}
.ring{display:flex;flex-direction:column;align-items:center;gap:4px;width:84px;text-align:center;font-size:11px;font-weight:600;color:var(--ink2);line-height:1.2}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;font-weight:800;font-size:14px;color:var(--ink)}
.ringbox{position:relative;display:grid;place-items:center}

/* training */
.session{border-radius:18px;padding:18px;background:linear-gradient(135deg,#fff4e0,#ffe4f0);margin-bottom:14px}
.timer{font-size:46px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.clicker{width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd1a1,#ff8a3d);box-shadow:0 10px 0 #d9661c,0 16px 30px rgba(255,120,40,.4);font-size:13px;font-weight:800;color:#fff;transition:transform .08s,box-shadow .08s}
.clicker:active{transform:translateY(8px);box-shadow:0 2px 0 #d9661c,0 6px 14px rgba(255,120,40,.4)}
.weekbars{display:flex;align-items:flex-end;gap:8px;height:90px}
.weekbars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--ink3);height:100%;justify-content:flex-end}
.weekbars i{width:100%;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,var(--orange),var(--pink))}

/* academy */

.trail .bar{background:rgba(255,255,255,.3);margin-top:auto}.trail .bar i{background:#fff}
.trail .tag{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.9);color:var(--violet);font-size:10px;font-weight:800;padding:3px 8px;border-radius:99px}
.lesson{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:#faf8ff;margin-bottom:8px;cursor:pointer;transition:.15s}

.badge{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;text-align:center;width:78px}

.quizopt{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:12px;background:#f5f2fd;margin-top:8px;font-weight:600;font-size:14px;transition:.15s}

.quizopt.right{background:#d6fbe9;color:#0b7a52}.quizopt.wrong{background:#ffe0e0;color:#b02222}

/* interakao */

.trans{border-radius:18px;padding:16px;background:linear-gradient(135deg,#eef7ff,#f6efff);margin-top:12px}
.trans .q{font-family:Fraunces,serif;font-size:21px;line-height:1.3;margin:6px 0 10px}
.emob{display:grid;grid-template-columns:80px 1fr 34px;align-items:center;gap:8px;font-size:12px;font-weight:600;margin-top:6px}
.chat{display:flex;flex-direction:column;gap:8px;max-height:360px;overflow:auto;padding:4px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:92%}
.msg .bub{background:#f1eef9;padding:9px 12px;border-radius:16px 16px 16px 4px;font-size:13px;line-height:1.4}

.msg.me{align-self:flex-end;flex-direction:row-reverse}

.msg .pa{font-size:22px}
.typing{display:inline-flex;gap:3px}.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink3);animation:tp 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{50%{transform:translateY(-4px);opacity:.4}}

/* reels */
.stories{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none}
.story{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:600;flex:none;width:68px}
.story .rg{width:62px;height:62px;border-radius:50%;padding:3px;background:conic-gradient(var(--pink),var(--orange),var(--yellow),var(--mint),var(--violet),var(--pink))}
.story .rg div{width:100%;height:100%;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:28px;border:2px solid #fff;overflow:hidden;background-size:cover;background-position:center}

.reel{aspect-ratio:9/14;border-radius:18px;position:relative;overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;cursor:pointer}

@keyframes spin{to{transform:rotate(360deg)}}

.reel .cap{position:relative;font-size:12px;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.3)}

.viewer{position:absolute;inset:0;z-index:5;background:#120c26;display:flex;flex-direction:column;color:#fff;animation:fade .2s}
.viewer .prog{display:flex;gap:4px;padding:10px}.viewer .prog i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden}.viewer .prog i b{display:block;height:100%;width:0;background:#fff}
.viewer .stage{flex:1;display:grid;place-items:center;font-size:110px;position:relative;background-size:contain;background-repeat:no-repeat;background-position:center}
.viewer .stage p{position:absolute;bottom:30px;left:0;right:0;text-align:center;font-size:17px;font-weight:700;padding:0 20px}

/* adventures */
.ba{position:relative;height:210px;border-radius:16px;overflow:hidden;user-select:none;touch-action:none}

.ba .after{clip-path:inset(0 0 0 50%)}

.ba .handle::after{content:"⇆";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:800;color:var(--violet);box-shadow:0 4px 12px rgba(0,0,0,.2)}
.ba .lab{position:absolute;top:10px;padding:3px 9px;border-radius:99px;background:rgba(0,0,0,.45);color:#fff;font-size:11px;font-weight:800}
.fan{border-radius:14px;aspect-ratio:1;display:grid;place-items:center;font-size:46px;position:relative;overflow:hidden}
.fan small{position:absolute;bottom:6px;left:6px;right:6px;font-size:10px;font-weight:700;background:rgba(255,255,255,.85);border-radius:8px;padding:3px 6px;display:flex;justify-content:space-between}
.timeline{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.vthumb{flex:none;width:130px;aspect-ratio:16/11;border-radius:12px;position:relative;overflow:hidden;cursor:pointer;color:#fff;display:flex;align-items:flex-end;padding:8px;font-size:12px;font-weight:800}
.vthumb .pl{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;background:rgba(0,0,0,.12)}

/* store */
.prod{background:#fff;border-radius:16px;padding:12px;box-shadow:0 0 0 1px var(--line);display:flex;flex-direction:column;gap:6px;position:relative;transition:.2s}

/* poetia */
.poem{font-family:Fraunces,serif;font-size:17px;line-height:1.6;white-space:pre-line}
.poem-t{font-family:Fraunces,serif;font-style:italic;font-size:22px;margin-bottom:8px}
.snd{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:#fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;transition:.15s}

.eq{display:flex;gap:2px;align-items:flex-end;height:18px}.eq i{width:3px;background:var(--violet);border-radius:2px;height:4px}
.snd.on .eq i{animation:eq .8s ease-in-out infinite}.eq i:nth-child(2){animation-delay:.2s!important}.eq i:nth-child(3){animation-delay:.4s!important}.eq i:nth-child(4){animation-delay:.1s!important}
@keyframes eq{50%{height:18px}}
.breath{width:170px;height:170px;margin:10px auto;border-radius:50%;background:radial-gradient(circle,#c9b8ff,#8b5cf6);display:grid;place-items:center;color:#fff;font-weight:800;transition:transform 4s ease-in-out;box-shadow:0 0 0 18px rgba(139,92,246,.12),0 0 0 36px rgba(139,92,246,.06)}

@keyframes tw{50%{opacity:.2}}

.empty{text-align:center;padding:30px;color:var(--ink3)}
.av2{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;flex:none}

/* pagamentos, brechó, consulta */
.pkg{border-radius:18px;padding:16px;background:#fff;box-shadow:0 0 0 1px var(--line);display:flex;flex-direction:column;gap:6px;position:relative;transition:.2s}
.pkg:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(50,30,120,.12),0 0 0 1px var(--line)}

.wallet{border-radius:20px;padding:18px;color:#fff;background:linear-gradient(120deg,#00b894,#0984e3);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.wallet .big{color:#fff}
.mbcr{background:linear-gradient(135deg,#2ed8a3,#3fa9ff);color:#fff;font-size:11px;padding:2px 7px;border-radius:99px;font-weight:800}
.paybox{width:min(520px,100%)}
.paym{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}

.sumline{display:flex;justify-content:space-between;font-size:14px;padding:4px 0}

.qr{width:170px;height:170px;margin:6px auto;display:block;image-rendering:pixelated;border-radius:10px;box-shadow:0 0 0 8px #fff,0 0 0 9px var(--line)}
.code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:#f5f3fb;border-radius:10px;padding:10px;word-break:break-all}
.demo{font-size:11px;font-weight:700;color:#a55d00;background:#fff4dc;border-radius:8px;padding:6px 10px;text-align:center;margin-top:10px}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid #e9e3ff;border-top-color:var(--violet);animation:spin 1s linear infinite;margin:20px auto}
.okmark{width:74px;height:74px;border-radius:50%;margin:10px auto;display:grid;place-items:center;font-size:38px;color:#fff;background:linear-gradient(135deg,#2ed8a3,#00b894);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.item .im{height:110px;border-radius:12px;display:grid;place-items:center;font-size:52px;background:#fff6ea center/cover no-repeat}
.item .hl{position:absolute;top:10px;right:10px;background:linear-gradient(135deg,#ffd93d,#ff9f43);color:#5a3200;font-size:10px;font-weight:800;padding:3px 7px;border-radius:8px}
.aibox{border-radius:16px;padding:14px;background:linear-gradient(135deg,#f3eeff,#eaf6ff);margin-top:10px}
.aitag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;background:#fff;color:var(--violet)}
.aitag.off{color:#a55d00}
.verdict{border-radius:18px;padding:16px;background:#fff;box-shadow:0 0 0 2px var(--violet);margin-top:12px}
.argcols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.argcols .card{font-size:13px;line-height:1.5}
.cchat{display:flex;flex-direction:column;gap:10px;padding:4px 2px 10px}
.cmsg{max-width:86%;padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.5;white-space:pre-wrap}
.cmsg.u{align-self:flex-end;background:linear-gradient(135deg,#8b5cf6,#ff6fa8);color:#fff;border-radius:16px 16px 4px 16px}

.urg{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;margin-bottom:6px}
.urg.baixa{background:#dcfbef;color:#0c8a5e}.urg.media{background:#fff1d6;color:#a55d00}.urg.alta{background:#ffe1e1;color:#c02a2a}
.vroom{position:absolute;inset:0;background:#0f0b22;color:#fff;display:grid;grid-template-columns:1fr 280px;z-index:6;animation:fade .3s}
.vstage{position:relative;display:grid;place-items:center;overflow:hidden}
.vremote{width:min(92%,640px);aspect-ratio:16/10;border-radius:20px;background:radial-gradient(circle at 50% 40%,#3b2a7a,#140f2e);display:grid;place-items:center;position:relative}
.vremote .face{font-size:110px;border-radius:50%;padding:18px;box-shadow:0 0 0 0 rgba(46,216,163,.6);animation:talk 1.6s infinite}
@keyframes talk{50%{box-shadow:0 0 0 18px rgba(46,216,163,0)}}
.vremote .nm{position:absolute;left:14px;bottom:12px;font-size:13px;font-weight:700;background:rgba(0,0,0,.4);padding:4px 10px;border-radius:99px}
.vself{position:absolute;right:20px;top:20px;width:150px;aspect-ratio:4/3;border-radius:14px;background:#2a2150 center/cover no-repeat;display:grid;place-items:center;font-size:44px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.vctl{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:10px;background:rgba(255,255,255,.08);padding:8px;border-radius:99px;backdrop-filter:blur(10px)}

/* stories em loop (home) + APPeTV + PetMatch */
.sloop{position:relative;width:min(330px,82vw);aspect-ratio:16/9;margin:18px auto 0;border-radius:18px;overflow:hidden;box-shadow:0 14px 40px rgba(80,40,180,.22),0 0 0 3px rgba(255,255,255,.8)}
.slwrap{position:relative;touch-action:none;cursor:grab}
.slwrap:active{cursor:grabbing}
.slwrap.free{position:fixed;z-index:6;margin:0}
.slwrap.free .sloop{margin:0}
.slwrap.dragging .sloop{box-shadow:0 26px 60px rgba(80,40,180,.35),0 0 0 3px #fff;transform:scale(1.03)}
.sloop{transition:transform .2s,box-shadow .2s}
.sl-stage{position:absolute;inset:0;display:grid;place-items:center;color:#fff;transition:opacity .6s;background-size:cover;background-position:center}
.sl-stage .pe{font-size:62px;animation:hop 1.6s ease-in-out infinite;position:absolute;top:18%;left:50%;transform:translateX(-50%)}
.sl-stage .cap{position:absolute;left:10px;right:10px;bottom:10px;font-size:12px;font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.45);text-align:left;line-height:1.3}
.sl-stage .cap b{display:block;font-size:11px;opacity:.9}
.sl-prog{position:absolute;top:7px;left:8px;right:8px;display:flex;gap:3px;z-index:2}
.sl-prog i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.35);overflow:hidden}.sl-prog i b{display:block;height:100%;width:0;background:#fff}
.sl-x{position:absolute;top:14px;right:8px;z-index:3;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;font-size:14px;display:grid;place-items:center}
.sl-live{position:absolute;top:15px;left:10px;z-index:3;font-size:10px;font-weight:800;background:#ff3b5c;color:#fff;padding:2px 7px;border-radius:99px;letter-spacing:.06em}
.sl-show{margin-top:14px;font-size:12px;font-weight:700;color:var(--violet);background:rgba(255,255,255,.75);padding:6px 12px;border-radius:99px}
.sl-tv{position:absolute;bottom:10px;right:8px;z-index:3;font-size:10px;font-weight:800;background:rgba(255,255,255,.9);color:var(--violet);padding:3px 8px;border-radius:99px}
/* TV cartoon 3D */
#tv{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);z-index:46;width:330px;animation:tvIn .55s cubic-bezier(.2,1.5,.4,1);filter:drop-shadow(0 26px 30px rgba(60,20,120,.35));touch-action:none}
@keyframes tvIn{from{transform:translateX(-50%) translateY(60px) scale(.6);opacity:0}}
#tv.out{animation:tvOut .35s forwards}@keyframes tvOut{to{transform:translateX(-50%) translateY(80px) scale(.5);opacity:0}}
.tv-ant{position:relative;height:56px}
.tv-lights{position:absolute;top:24px;left:26px;display:flex;gap:7px;z-index:5;background:rgba(255,255,255,.55);backdrop-filter:blur(10px);padding:6px 9px;border-radius:99px;box-shadow:0 4px 12px rgba(60,20,120,.2)}
.tv-lights button{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2),0 1px 2px rgba(0,0,0,.2);position:relative}
.tv-lights .c{background:#ff5f57}.tv-lights .m{background:#febc2e}.tv-lights .x{background:#28c840}
.tv-lights:hover button::after{position:absolute;inset:0;display:grid;place-items:center;font-size:10px;font-weight:800;color:rgba(0,0,0,.55)}
.tv-lights:hover .c::after{content:"×"}.tv-lights:hover .m::after{content:"–"}.tv-lights:hover .x::after{content:"+"}
#tv.big .tv-lights:hover .x::after{content:"−"}
#tv{transition:width .35s cubic-bezier(.3,1.2,.5,1),left .35s,top .35s}
#tv.drag{transition:none}

function loadPhoto(file,cb){const u=URL.createObjectURL(file);const im=new Image();
  im.onload=()=>{const sc=Math.min(1,1600/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);cb(c.toDataURL('image/jpeg',.82))};
  im.onerror=()=>{URL.revokeObjectURL(u);cb(null)};im.src=u}
function applyBg(){const el=$('#photoBg');const on=!!(S.photo&&S.bgPhoto);if(on)el.style.backgroundImage=`url(${S.photo})`;el.classList.toggle('on',on);document.body.classList.toggle('hasphoto',on)}
const avatarHTML=()=>S.photo?`<img src="${S.photo}" alt="" style="width:100%;height:100%;object-fit:cover">`:S.pet.emoji;
const chipDigits=v=>(v||'').replace(/\D/g,'');
function chipInfo(n){const d=chipDigits(n);if(!d)return{ok:false,msg:''};
  if(d.length===15){const cc=d.slice(0,3);return{ok:true,msg:'✓ Padrão ISO 11784/11785 · '+(cc==='076'?'código 076 (Brasil)':(+cc>=900&&+cc<=998)?'código de fabricante '+cc:'código de país '+cc)}}
  if(d.length===9||d.length===10)return{ok:true,msg:'Formato antigo ('+d.length+' dígitos): alguns leitores ISO podem não ler.'};
  return{ok:false,msg:'O número ISO tem 15 dígitos ('+d.length+' digitados).'}}
const chipFmt=n=>{const d=chipDigits(n);return d.length===15?d.replace(/(\d{3})(\d{3})(\d{3})(\d{3})(\d{3})/,'$1 $2 $3 $4 $5'):d};
const chipShort=n=>'••• '+chipDigits(n).slice(-4);
const hasChip=()=>S.chip.has&&chipInfo(S.chip.num).ok;
function photoHTML(){return `<div class="f"><label>Foto do pet ${S.withTutor?'com você':'(de preferência com você)'}</label>
  <label class="photodrop" style="${S.photo?`background-image:url(${S.photo})`:''}">${S.photo?'':'<span>📷<br>Envie uma foto de vocês dois juntos<br><small class="mut">ela vira o fundo da sua tela</small></span>'}<input type="file" accept="image/*" data-photo hidden></label>
  <div class="row" style="margin-top:6px;flex-wrap:wrap;gap:14px"><label class="row mut" style="gap:6px;cursor:pointer"><input type="checkbox" data-with ${S.withTutor?'checked':''}> Estou na foto com ele</label><label class="row mut" style="gap:6px;cursor:pointer"><input type="checkbox" data-bgp ${S.bgPhoto?'checked':''}> Usar como fundo da tela</label>${S.photo?'<button class="btn g sm" data-rmphoto type="button">Remover foto</button>':''}</div></div>`}
function bindPhoto(r,onChange){
  const f=$('[data-photo]',r);if(f)f.onchange=e=>{const file=e.target.files[0];if(!file)return;loadPhoto(file,d=>{if(!d)return;S.photo=d;if(!S.bgTouched)S.bgPhoto=S.withTutor;applyBg();saveProfile();onChange()})};
  const w=$('[data-with]',r);if(w)w.onchange=()=>{S.withTutor=w.checked;if(!S.bgTouched)S.bgPhoto=w.checked;applyBg();saveProfile();onChange()};
  const g=$('[data-bgp]',r);if(g)g.onchange=()=>{S.bgPhoto=g.checked;S.bgTouched=true;applyBg();saveProfile();onChange()};
  const rm=$('[data-rmphoto]',r);if(rm)rm.onclick=()=>{S.photo='';applyBg();saveProfile();onChange()};
}
function chipFormHTML(){const c=S.chip;return `<div class="f"><label>Microchip</label><div class="pick" data-chiphas><button type="button" data-v="1" class="${c.has?'on':''}">Tem microchip</button><button type="button" data-v="0" class="${!c.has?'on':''}">Ainda não tem</button></div></div>
  <div data-chipfields class="${c.has?'':'hidden'}"><div class="f"><label>Número do chip</label><input data-c="num" inputmode="numeric" maxlength="19" placeholder="15 dígitos, ex.: 076 099 000 123 456" value="${chipFmt(c.num)}"><small data-chipmsg class="mut"></small></div>
  <div class="row2"><div class="f"><label>Data do implante</label><input type="date" data-c="date" value="${c.date}"></div><div class="f"><label>Clínica / veterinário</label><input data-c="where" value="${c.where}" placeholder="Opcional"></div></div></div>
  <div class="row2"><div class="f"><label>RG Animal (SinPatinhas)</label><input data-c="rg" value="${c.rg}" placeholder="Opcional"></div><div class="f"><label>Castrado?</label><div class="pick" data-neut><button type="button" data-v="1" class="${c.neutered?'on':''}">Sim</button><button type="button" data-v="0" class="${!c.neutered?'on':''}">Não</button></div></div></div>`}
function bindChip(r,onChange=()=>{}){
  const msg=()=>{const m=$('[data-chipmsg]',r);if(!m)return;const i=chipInfo(S.chip.num);m.textContent=i.msg;m.style.color=i.ok?'#0c8a5e':'#c02a2a'};
  $$('[data-chiphas] button',r).forEach(b=>b.onclick=()=>{S.chip.has=b.dataset.v==='1';$$('[data-chiphas] button',r).forEach(x=>x.classList.toggle('on',x===b));$('[data-chipfields]',r).classList.toggle('hidden',!S.chip.has);saveProfile();onChange()});
  $$('[data-neut] button',r).forEach(b=>b.onclick=()=>{S.chip.neutered=b.dataset.v==='1';$$('[data-neut] button',r).forEach(x=>x.classList.toggle('on',x===b));saveProfile();onChange()});
  $$('[data-c]',r).forEach(i=>{i.oninput=()=>{if(i.dataset.c==='num'){S.chip.num=chipDigits(i.value).slice(0,15);msg()}else S.chip[i.dataset.c]=i.value.trim()};
    i.onchange=()=>{if(i.dataset.c==='num')i.value=chipFmt(S.chip.num);saveProfile();onChange()}});
  msg();
}

function buildHome(){
  const ch=$('#chips');
  ch.innerHTML=CHIPS.map(c=>`<button class="chip" type="button">${c}</button>`).join('');
  $$('.chip',ch).forEach((b,i)=>b.onclick=()=>{$('#pin').value=EXAMPLES[[0,1,2,4,3,5][i]];submitPrompt()});
  layoutOrbit();buildHomeLoop();
  // typewriter placeholder
  let ei=0,ci=0,del=false;const inp=$('#pin');
  (function tick(){
    if(!$('#home')||$('#home').classList.contains('leave'))return;
    const s=EXAMPLES[ei];
    if(!del){ci++;if(ci>s.length){del=true;setTimeout(tick,1600);inp.placeholder=s;return}}
    else{ci--;if(ci<=0){del=false;ei=(ei+1)%EXAMPLES.length}}
    inp.placeholder=s.slice(0,ci)+(ci<s.length?'▍':'');
    setTimeout(tick,del?22:55);
  })();
}
function layoutOrbit(){
  const o=$('#orbit');const W=innerWidth,H=innerHeight;const mob=W<760;
  const rx=mob?W*.42:Math.min(W*.42,620), ry=mob?H*.40:Math.min(H*.40,360);
  o.innerHTML=ORDER.map((id,i)=>{
    let a=-Math.PI/2+i*(2*Math.PI/ORDER.length);
    let x=W/2+Math.cos(a)*rx, y=H/2+Math.sin(a)*ry;
    if(mob){ // faixas no topo e na base no celular
      const N=ORDER.length,hh=Math.ceil(N/2),top=i<hh,n=top?hh:N-hh,j=top?i:i-hh;
      x=W*(j+.5)/n; y=top?(j%2?96:52):H-(j%2?96:52);
    }
    return `<button class="orb" data-id="${id}" style="left:${x}px;top:${y}px;animation-delay:${-i*.45}s">${icon(id)}<span class="lbl">${APPS[id].n}</span></button>`;
  }).join('');
  $$('.orb',o).forEach(b=>b.onclick=()=>startWith([b.dataset.id],APPS[b.dataset.id].n));
}
addEventListener('resize',()=>{if(!$('#home').classList.contains('leave'))layoutOrbit()});

const GOALS=['Obediência básica','Passear sem puxar','Reduzir ansiedade','Socialização','Truques divertidos','Saúde em dia','Controle de peso','Aventuras ao ar livre','Competições'];
function inferGoals(ids,text){
  const t=norm(text||''),g=new Set();
  if(ids.includes('adestra'))g.add('Obediência básica');
  if(/puxa/.test(t))g.add('Passear sem puxar');
  if(ids.includes('poetia'))g.add('Reduzir ansiedade');
  if(ids.includes('saude'))g.add('Saúde em dia');
  if(ids.includes('aventuras'))g.add('Aventuras ao ar livre');
  if(ids.includes('eventos')||/competi|desafio/.test(t))g.add('Competições');
  if(/socializ|outros caes|brigar/.test(t))g.add('Socialização');
  if(/gord|peso/.test(t))g.add('Controle de peso');
  return g.size?[...g]:['Obediência básica','Passear sem puxar'];
}
function openOnboarding(ids,text){
  const goals=new Set(inferGoals(ids,text));let step=0;
  const w=document.createElement('div');w.className='modalwrap';document.body.appendChild(w);
  const draw=()=>{
    w.innerHTML=`<div class="modal">
      <div class="steps"><i class="on"></i><i class="${step>0?'on':''}"></i><i class="${step>1?'on':''}"></i></div>
      ${step===0?`<h2>Vamos conhecer seu pet 🐾</h2><p class="m">Isso personaliza trilhas, treinos e o painel. Leva 30 segundos.</p>
        <div class="f"><label>Avatar</label><div class="pick avatars">${['🐶','🐕','🐩','🦮','🐕‍🦺','🐱','🐰'].map(a=>`<button data-av="${a}" class="${S.pet.emoji===a?'on':''}">${a}</button>`).join('')}</div></div>
        ${photoHTML()}
        <div class="row2"><div class="f"><label>Nome do pet</label><input id="oName" value="${S.pet.name}"></div>
        <div class="f"><label>Seu nome</label><input id="oTutor" value="${S.tutor}" placeholder="Como te chamamos?"></div></div>
        <div class="row2"><div class="f"><label>Raça</label><input id="oBreed" value="${S.pet.breed}"></div>
        <div class="f"><label>Idade</label><input id="oAge" value="${S.pet.age}"></div></div>
        <div class="f"><label>Nível de energia</label><div class="pick" id="oEnergy">${['Baixa','Média','Alta','Turbo'].map(x=>`<button class="${S.pet.energy===x?'on':''}">${x}</button>`).join('')}</div></div>`
      :step===1?`<h2>Quais são os objetivos de vocês?</h2><p class="m">Já marquei alguns a partir do que você escreveu. Ajuste à vontade.</p>
        <div class="f"><div class="pick" id="oGoals">${GOALS.map(x=>`<button class="${goals.has(x)?'on':''}">${x}</button>`).join('')}</div></div>
        <div class="f"><label>Tempo por dia para treino e atenção</label><div class="range"><input type="range" id="oTime" min="5" max="90" step="5" value="${S.time}"><b id="oTimeV">${S.time} min</b></div></div>`
      :`<h2>História e identificação 💛</h2><p class="m">Como ele chegou na sua vida? Tem algum medo, mania ou sonho? E, se tiver, registre o microchip.</p>
        <div class="f"><textarea id="oStory" rows="4" placeholder="Ex.: Adotei o Thor numa feira em 2024. Ele é carinhoso, mas tem medo de trovão e puxa muito na rua...">${S.story}</textarea></div>${chipFormHTML()}`}
      <div class="mact"><button class="btn g" id="oSkip">${step===0?'Pular':'Voltar'}</button><button class="btn p" id="oNext">${step<2?'Continuar →':'Montar meu APPET ✨'}</button></div>
    </div>`;
    if(step===0){
      $$('[data-av]',w).forEach(b=>b.onclick=()=>{S.pet.emoji=b.dataset.av;$$('[data-av]',w).forEach(x=>x.classList.toggle('on',x===b))});
      $$('#oEnergy button',w).forEach(b=>b.onclick=()=>{S.pet.energy=b.textContent;$$('#oEnergy button',w).forEach(x=>x.classList.toggle('on',x===b))});
      bindPhoto(w,()=>{collect();draw()});
    }
    if(step===2)bindChip(w);
    if(step===1){
      $$('#oGoals button',w).forEach(b=>b.onclick=()=>{goals.has(b.textContent)?goals.delete(b.textContent):goals.add(b.textContent);b.classList.toggle('on')});
      $('#oTime',w).oninput=e=>{$('#oTimeV',w).textContent=e.target.value+' min'};
    }
    const collect=()=>{
      if(step===0){S.pet.name=$('#oName',w).value.trim()||'Meu pet';S.tutor=$('#oTutor',w).value.trim();S.pet.breed=$('#oBreed',w).value.trim();S.pet.age=$('#oAge',w).value.trim()}
      if(step===1){S.goals=[...goals];S.time=+$('#oTime',w).value}
      if(step===2){S.story=$('#oStory',w).value.trim()}
    };
    $('#oNext',w).onclick=()=>{collect();if(step<2){step++;draw()}else{S.onboarded=true;saveProfile();w.remove();enterDesk()}};
    $('#oSkip',w).onclick=()=>{if(step===0){S.onboarded=true;saveProfile();w.remove();enterDesk()}else{collect();step--;draw()}};
  };
  draw();
}

  document.body.appendChild(s);const inp=$('#spin');inp.focus();let sel=0,items=[];
  const draw=()=>{
    const v=inp.value.trim();const r=v?route(v):[];
    const byName=ORDER.filter(id=>v&&norm(APPS[id].n).includes(norm(v)));

    const v=inp.value.trim();const r=v?route(v):[];s.remove();
    if(items[sel]==='__ask'||(!items[sel])){pendingPrompt={ids:[],text:v};enterDesk();return}

    openApp(items[sel]);
  };

  inp.onkeydown=e=>{if(e.key==='ArrowDown'){sel++;draw();e.preventDefault()}else if(e.key==='ArrowUp'){sel--;draw();e.preventDefault()}else if(e.key==='Enter')go();else if(e.key==='Escape')s.remove()};

let AC;const ac=()=>{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC};
const bufCache={};
function noiseBuf(kind){
  if(bufCache[kind])return bufCache[kind];
  const a=ac(),len=a.sampleRate*3,b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0);let last=0;
  for(let i=0;i<len;i++){const w=Math.random()*2-1;if(kind==='brown'){last=(last+.02*w)/1.02;d[i]=last*3.5}else d[i]=w}
  return bufCache[kind]=b;
}
function tone(t0,dur,f0,f1,type='sawtooth',vol=.25,dest){
  const a=ac(),o=a.createOscillator(),g=a.createGain();o.type=type;
  o.frequency.setValueAtTime(f0,t0);o.frequency.exponentialRampToValueAtTime(Math.max(f1,20),t0+dur);
  g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+.012);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g).connect(dest||a.destination);o.start(t0);o.stop(t0+dur+.05);
}
function noiseBurst(t0,dur,freq,vol){
  const a=ac(),s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
  s.buffer=noiseBuf('white');f.type='bandpass';f.frequency.value=freq;f.Q.value=1.1;
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  s.connect(f).connect(g).connect(a.destination);s.start(t0);s.stop(t0+dur+.02);
}
function bark(t,f=560,d=.15){tone(t,d,f,f*.55,'sawtooth',.2);tone(t,d,f*1.5,f*.7,'square',.04);noiseBurst(t,d*.8,1500,.22)}
const SYN={
  alerta(){const t=ac().currentTime+.02;bark(t);bark(t+.3,600);return 700},
  brincar(){const t=ac().currentTime+.02;for(let i=0;i<4;i++)bark(t+i*.19,700+i*25,.1);return 950},
  saudade(){const a=ac(),t=a.currentTime+.02,o=a.createOscillator(),g=a.createGain(),l=a.createOscillator(),lg=a.createGain();
    o.type='triangle';o.frequency.setValueAtTime(380,t);o.frequency.linearRampToValueAtTime(760,t+.8);o.frequency.linearRampToValueAtTime(540,t+2);
    l.frequency.value=5.5;lg.gain.value=14;l.connect(lg).connect(o.frequency);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.22,t+.25);g.gain.setValueAtTime(.22,t+1.6);g.gain.exponentialRampToValueAtTime(.0001,t+2.1);
    o.connect(g).connect(a.destination);o.start(t);l.start(t);o.stop(t+2.2);l.stop(t+2.2);return 2200},
  dor(){const t=ac().currentTime+.02;for(let i=0;i<3;i++)tone(t+i*.42,.34,950,1350,'sine',.16);return 1300},
  aviso(){const a=ac(),t=a.currentTime+.02,o=a.createOscillator(),f=a.createBiquadFilter(),g=a.createGain(),m=a.createGain(),l=a.createOscillator(),lg=a.createGain();
    o.type='sawtooth';o.frequency.value=88;f.type='lowpass';f.frequency.value=650;
    g.gain.value=.12;l.frequency.value=23;lg.gain.value=.1;l.connect(lg).connect(g.gain);
    m.gain.setValueAtTime(.0001,t);m.gain.exponentialRampToValueAtTime(1,t+.2);m.gain.setValueAtTime(1,t+1.4);m.gain.exponentialRampToValueAtTime(.0001,t+1.7);
    o.connect(f).connect(g).connect(m).connect(a.destination);o.start(t);l.start(t);o.stop(t+1.8);l.stop(t+1.8);return 1800},

/* ambient sounds for Poetia */
const AMB={};
function startAmb(k){
  const a=ac(),out=a.createGain();out.gain.value=0;out.connect(a.destination);out.gain.linearRampToValueAtTime(.9,a.currentTime+1);
  const nodes=[];let iv;
  if(k==='chuva'){const s=a.createBufferSource();s.buffer=noiseBuf('white');s.loop=true;const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=1100;const g=a.createGain();g.gain.value=.12;s.connect(f).connect(g).connect(out);s.start();nodes.push(s);
    iv=setInterval(()=>{const t=a.currentTime;tone(t,.05,2400+Math.random()*1800,1200,'sine',.03,out)},120)}
  if(k==='marrom'){const s=a.createBufferSource();s.buffer=noiseBuf('brown');s.loop=true;const g=a.createGain();g.gain.value=.35;s.connect(g).connect(out);s.start();nodes.push(s)}
  if(k==='coracao'){const beat=()=>{const t=a.currentTime;tone(t,.18,70,45,'sine',.5,out);tone(t+.28,.16,62,42,'sine',.32,out)};beat();iv=setInterval(beat,1000)}
  if(k==='melodia'){const sc=[261.6,293.7,329.6,392,440,523.3,587.3];const play=()=>{const t=a.currentTime,f=pick(sc);const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.14,t+.3);g.gain.exponentialRampToValueAtTime(.0001,t+2.8);o.connect(g).connect(out);o.start(t);o.stop(t+3)};play();iv=setInterval(play,1400)}
  AMB[k]={out,nodes,iv};
}
function stopAmb(k){const x=AMB[k];if(!x)return;clearInterval(x.iv);const a=ac();x.out.gain.linearRampToValueAtTime(0,a.currentTime+.5);setTimeout(()=>{x.nodes.forEach(n=>{try{n.stop()}catch(e){}});x.out.disconnect()},600);delete AMB[k]}

function endSession(){
  clearInterval(sess.iv);if(!sess.on)return;sess.on=false;
  const used=Math.max(1,Math.round((plan().min*60-sess.left)/60));
  sess.c.p=clamp(sess.c.p+Math.max(2,sess.reps*2),0,100);S.week[(now().getDay()+6)%7]+=used;
  rerender('adestra');addXP(10+sess.reps,`Sessão de “${sess.c.n}” com ${sess.reps} acertos.`);
}

function drawWave(cv,data,prog=1,anim){
  const c=cv.getContext('2d'),W=cv.width,H=cv.height;c.clearRect(0,0,W,H);const n=90,bw=W/n;
  const gr=c.createLinearGradient(0,0,W,0);gr.addColorStop(0,'#ff6fa8');gr.addColorStop(1,'#8b5cf6');
  for(let i=0;i<n;i++){let v=data?data[Math.floor(i/n*data.length)]:.04;if(anim)v=Math.random()*.9*Math.sin(i/n*Math.PI)+.05;const h=Math.max(3,v*H*.9);c.fillStyle=i/n<=prog?gr:'#ddd6f3';c.beginPath();c.roundRect?c.roundRect(i*bw+1,(H-h)/2,bw-2,h,2):c.rect(i*bw+1,(H-h)/2,bw-2,h);c.fill()}
}

async function analyzeFile(file){
  $('#iaMsg').textContent='Carregando áudio…';
  try{
    const buf=await file.arrayBuffer();const a=ac();const au=await a.decodeAudioData(buf);
    const d=au.getChannelData(0),sr=au.sampleRate,dur=au.duration;
    const n=90,step=Math.floor(d.length/n),env=[];let zc=0,rms=0,peaks=0,prevHi=false;
    for(let i=0;i<n;i++){let s=0;for(let j=0;j<step;j+=4){const v=d[i*step+j]||0;s+=v*v}const r=Math.sqrt(s/(step/4));env.push(r)}
    const mx=Math.max(...env)||1;for(let i=0;i<n;i++){env[i]/=mx;const hi=env[i]>.55;if(hi&&!prevHi)peaks++;prevHi=hi}
    for(let i=1;i<d.length;i+=2){if((d[i-1]<0)!==(d[i]<0))zc++;rms+=d[i]*d[i]}
    const zcr=zc/dur/2; // aprox. "tom"
    let k='alerta';
    if(dur>1.4&&peaks<=2&&zcr>250)k='saudade';
    else if(zcr<220&&dur>.8)k='aviso';
    else if(zcr>1400&&peaks>=2)k='dor';
    else if(peaks>=3)k='brincar';
    try{const s=a.createBufferSource();s.buffer=au;s.connect(a.destination);s.start();setTimeout(()=>{try{s.stop()}catch(e){}},Math.min(dur,4)*1000)}catch(e){}
    analyzeSample(k,Math.min(dur,4)*1000,`${file.name} · ${dur.toFixed(1)}s · ${peaks} picos · tom ~${Math.round(zcr)} Hz`,{env});
  }catch(e){$('#iaMsg').textContent='Não consegui ler esse arquivo. Tente um .mp3, .wav ou .m4a.'}
}

async function circOp(kind,arg){
  if(SERVER&&ME){let d;
    if(kind==='close')d=await api('/me/close',{method:'PUT',body:{members:arg}});
    else if(kind==='create')d=await api('/me/groups',{method:'POST',body:arg});
    else if(kind==='update')d=await api('/me/groups/'+arg.id,{method:'PATCH',body:arg});
    else d=await api('/me/groups/'+arg,{method:'DELETE'});
    CIRCLES=d;[...CIRCLES.close,...CIRCLES.groups.flatMap(g=>g.members)].forEach(u=>UCACHE[u.id]=u);return}
  const card=id=>UCACHE[id];
  if(kind==='close')CIRCLES.close=arg.map(card).filter(Boolean);
  else if(kind==='create')CIRCLES.groups.push({id:'g'+Date.now(),name:arg.name,members:(arg.members||[]).map(card).filter(Boolean)});
  else if(kind==='update'){const g=CIRCLES.groups.find(x=>x.id===arg.id);if(arg.name)g.name=arg.name;if(arg.members)g.members=arg.members.map(card).filter(Boolean)}

}

function showStory(items,start=0,onDone){
  const host=wins.reels||wins[Object.keys(wins)[0]];if(!host)return;const v=document.createElement('div');v.className='viewer';
  v.innerHTML=`<div class="prog">${items.map(()=>'<i><b></b></i>').join('')}</div><div class="row" style="padding:0 12px"><b id="vn"></b><span style="flex:1"></span><button id="vx" style="font-size:22px;color:#fff">×</button></div><div class="stage" id="vs"></div>`;
  host.appendChild(v);let i=start,raf,t0,last;
  const show=()=>{if(i>=items.length){close();return}const it=items[i];$('#vn',v).textContent=it.n;const st=$('#vs',v);
    const p=it.post&&POSTS[it.post];const vid=p&&p.mediaType==='video';
    st.style.backgroundImage=it.url&&!vid?`url(${it.url})`:'';
    st.innerHTML=`${vid?`<video src="${it.url}" autoplay playsinline loop style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain"></video>`:it.url?'':esc(it.e||'')}<p>${esc(it.t||'')}</p>${p?`<div class="vreact">${reactBar(p)}</div>`:''}`;
    if(p)bindReacts(st);
    $$('.prog b',v).forEach((b,j)=>b.style.width=j<i?'100%':'0');t0=last=performance.now();cancelAnimationFrame(raf);
    const dur=vid?8000:4000;
    const step=()=>{const n=performance.now();if($('.rbar.open',v))t0+=n-last;last=n;const pr=(n-t0)/dur;$$('.prog b',v)[i].style.width=Math.min(100,pr*100)+'%';if(pr>=1){it.seen=true;i++;show()}else raf=requestAnimationFrame(step)};step()};
  const close=()=>{cancelAnimationFrame(raf);v.remove();onDone&&onDone()};
  let ct=null;
  $('#vx',v).onclick=close;$('#vs',v).onclick=e=>{if(e.target.closest('.rbar'))return;clearTimeout(ct);
    if(e.detail>=3){const bar=$('.rbar',v);if(bar){e.stopPropagation();openPicker(bar,$('[data-rpick]',bar),{x:e.clientX,y:e.clientY})}return}
    if(e.detail===1)ct=setTimeout(()=>{if($('.rpicker.fixed'))return;items[i].seen=true;i++;show()},320)};show();
}

/* =========================================================

   ========================================================= */
let API_BASE=null; // vira '/api' quando o servidor do APPET responde
let samplePromise=null;
const AI={provider:'…',last:null};
async function getSample(){
  if(!window.claude||typeof window.claude.use!=='function')return null;
  if(!samplePromise)samplePromise=window.claude.use('sample').catch(()=>null);
  try{return await samplePromise}catch(e){return null}
}
/* askAI: tenta Claude; se falhar, usa o fallback local. Retorna {text|value, provider} */
async function askAI(input,{json=false,onText,fallback,tier='quick'}={}){
  const s=await getSample();
  if(s){
    try{
      if(json){const value=await s.json(input,{modelTier:tier});AI.provider='Claude';return{value,provider:'Claude'}}
      const r=await s(input,{modelTier:tier,cache:false,onText:onText?({text})=>onText(text):undefined});
      AI.provider='Claude';return{text:r.text,provider:'Claude'};
    }catch(e){AI.last=e&&e.code}
  }
  if(API_BASE){ // servidor próprio (pacote para download): IA com failsafe Claude → Gemini → OpenAI → Pollinations
    try{
      const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),25000);
      const messages=typeof input==='string'?[{role:'user',content:input}]:input;
      const r=await fetch(API_BASE+'/ai/raw',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({messages,json}),signal:ctrl.signal});clearTimeout(t);
      if(r.ok){const d=await r.json();AI.provider=d.provider;if(json)return{value:d.value,provider:d.provider};onText&&onText(d.text);return{text:d.text,provider:d.provider}}
    }catch(e){}
  }
  AI.provider='local';
  const fb=fallback?fallback():'';
  return json?{value:fb,provider:'local'}:{text:fb,provider:'local'};
}

function drawQR(cv,seed){
  const c=cv.getContext('2d'),N=29,sz=cv.width/N;let x=seed.split('').reduce((a,ch)=>a*31+ch.charCodeAt(0),7)>>>0;
  const rnd=()=>(x=(x*1103515245+12345)>>>0)/4294967296;
  c.fillStyle='#fff';c.fillRect(0,0,cv.width,cv.height);c.fillStyle='#1d1b3a';
  for(let i=0;i<N;i++)for(let j=0;j<N;j++)if(rnd()>.52)c.fillRect(i*sz,j*sz,sz,sz);
  [[0,0],[N-7,0],[0,N-7]].forEach(([a,b])=>{c.fillStyle='#1d1b3a';c.fillRect(a*sz,b*sz,7*sz,7*sz);c.fillStyle='#fff';c.fillRect((a+1)*sz,(b+1)*sz,5*sz,5*sz);c.fillStyle='#1d1b3a';c.fillRect((a+2)*sz,(b+2)*sz,3*sz,3*sz)});
}

function disputeHTML(){const o=S.orders[dispute.i];return `<button class="btn g sm" id="dBack">← Pedidos</button>

   <p class="mut" style="font-size:12px;margin-top:6px">A IA compara o anúncio, os argumentos e as provas e propõe uma decisão. Qualquer lado pode pedir revisão humana.</p>`}`}
function sellFallback(){const base={Transporte:150,Conforto:120,Casa:140,Passeio:80,Roupas:40,Alimentação:60,Brinquedos:30,Higiene:35}[draft.c]||60;
  const f={Novo:1,Seminovo:.7,Usado:.5,'Usado · marcas de uso':.35}[draft.cond]||.5;const p=Math.round(base*f);
  return{titulo:(draft.t||draft.c)+' · '+draft.cond.toLowerCase(),descricao:`${draft.t||'Item'} em condição ${draft.cond.toLowerCase()}. ${draft.d?draft.d+' ':''}Fotos reais do item. Retirada combinada ou envio pelo app, com pagamento protegido.`,preco_sugerido:p,faixa_min:Math.round(p*.8),faixa_max:Math.round(p*1.2),dicas:['Mostre defeitos nas fotos: evita disputa.','Informe tamanho e medidas.','Higienize o item antes da entrega.']}}
function disputeFallback(o,r,a,ev){
  if(r==='Não recebi o item')return{decisao:'Reembolso integral ao comprador',reembolso_percentual:100,devolver_item:false,justificativa:'Não há comprovante de entrega ao comprador. Pela regra do pagamento protegido, o valor retido volta ao comprador.',pontos_comprador:'Afirma não ter recebido; a entrega não foi confirmada.',pontos_vendedor:'Diz ter enviado, mas não apresentou comprovante.'};
  if(r==='Me arrependi da compra')return{decisao:o.novo?'Devolução com reembolso integral':'Sem reembolso',reembolso_percentual:o.novo?100:0,devolver_item:!!o.novo,justificativa:o.novo?'Item novo, dentro do prazo de arrependimento: devolução com reembolso.':'Item usado entregue como anunciado: arrependimento sozinho não justifica reembolso no Brechó.',pontos_comprador:'Desistiu da compra.',pontos_vendedor:'Entregou o item conforme o anúncio.'};
  const pct=ev?100:50;return{decisao:ev?'Devolução com reembolso integral':'Reembolso parcial de 50%',reembolso_percentual:pct,devolver_item:ev,justificativa:ev?'A prova enviada indica diferença em relação ao anúncio. O item volta ao vendedor e o comprador é reembolsado.':'Sem prova anexada, a divergência não pode ser confirmada por completo; propõe-se acordo de 50%.',pontos_comprador:a||r,pontos_vendedor:'Afirma que o item foi anunciado corretamente.'};
}

function consultFallback(q){const t=norm(q);
  if(/chocolat|uva|passa|xilitol|veneno|envenen|convuls|sangr|nao respira|atropel|desmai/.test(t))return 'URGÊNCIA: alta\nIsso pode ser grave. Procure um veterinário ou pronto-atendimento 24 h agora. Leve a embalagem do que ele ingeriu, se houver. Não induza vômito sem orientação veterinária.';
  if(/vomit|diarr|nao come|febre|manc|coc|orelha|olho/.test(t))return 'URGÊNCIA: média\nObserve por algumas horas: água fresca à vontade, sinais de apatia, sangue ou dor. Se piorar, durar mais de 24 h ou ele parar de beber água, marque uma consulta. Posso agendar uma videoconsulta para você.';
  return 'URGÊNCIA: baixa\nBoa pergunta! Em geral, rotina estável, reforço positivo e sessões curtas funcionam melhor. Se quiser, me conte mais detalhes sobre o '+S.pet.name+' que eu personalizo a resposta.';
}
function parseUrg(t){const m=/^\s*URG[ÊE]NCIA:\s*(baixa|m[ée]dia|alta)\s*\n?/i.exec(t||'');if(!m)return{u:null,body:t||''};return{u:norm(m[1]),body:t.slice(m[0].length)}}

B.consulta=b=>{
  const ch=$('#cch',b);if(ch)ch.scrollTop=1e6;
  const send=async q=>{q=q.trim();if(!q||cbusy)return;cchat.push({role:'user',content:q});cbusy=true;rerender('consulta');
    const sys=`Você é o assistente de saúde e comportamento do APPET. Não substitui o veterinário e não prescreve medicamentos nem doses. Responda em português do Brasil, com carinho e de forma prática, em até 120 palavras. A PRIMEIRA linha deve ser exatamente "URGÊNCIA: baixa", "URGÊNCIA: média" ou "URGÊNCIA: alta". Se for alta, oriente procurar atendimento veterinário imediatamente.\n${petContext()}`;
    const msgs=cchat.filter(m=>!m.pending).map((m,i)=>({role:m.role,content:i===0?sys+'\n\nPergunta do tutor: '+m.content:m.content}));
    const live={role:'assistant',content:'',pending:true};cchat.push(live);
    const r=await askAI(msgs,{onText:t=>{live.content=t;const el=$('#cch');if(el){const last=el.lastElementChild;if(last&&last.classList.contains('a')){const p=parseUrg(t);last.innerHTML=(p.u?`<span class="urg ${p.u}">Urgência ${p.u}</span><br>`:'')+esc(p.body)}else rerender('consulta');el.scrollTop=1e6}},fallback:()=>consultFallback(q)});
    live.content=r.text||consultFallback(q);live.provider=r.provider;delete live.pending;cbusy=false;rerender('consulta');setTimeout(()=>{const i=$('#cIn');if(i)i.focus()},50)};
  $('#cForm',b).onsubmit=e=>{e.preventDefault();send($('#cIn',b).value)};
  $$('[data-q]',b).forEach(x=>x.onclick=()=>send(x.dataset.q));

const SLG=['linear-gradient(135deg,#ff6fa8,#ffb347)','linear-gradient(135deg,#3fa9ff,#74ebd5)','linear-gradient(135deg,#2ed8a3,#9be15d)','linear-gradient(135deg,#8b5cf6,#ff6fa8)','linear-gradient(135deg,#ffd93d,#ff9f43)','linear-gradient(135deg,#5b3aa8,#c26bd1)'];
function loopItems(ch='stories'){
  const mine=S.stories.map(s=>({n:(S.pet.name||'Você')+(s.vis==='public'?' · 🌎 comunidade':' · 🔒 só você'),url:s.url,video:s.mediaType==='video',t:s.t}));
  const feed=(COMM.stories||[]).map(s=>({n:`${s.petName||'Pet'} ${s.petEmoji||''} · 🌎`,url:s.url,video:s.mediaType==='video',t:s.text}));
  const own=S.photo?[{n:S.pet.name,url:S.photo,t:`${S.pet.name} & ${S.tutor||'tutor'} 💜`}]:[];
  if(ch==='reels')return [...(COMM.reels||[]).map(p=>({n:`${p.petName||'Pet'} ${p.petEmoji||''} · 🌎`,url:p.url,video:p.mediaType==='video',t:p.text})),...REELS.map(r=>({n:r.u+' · exemplo',e:r.e,t:r.c}))];
  if(ch==='aventuras')return HL.map(h=>({n:h.n,e:h.e,t:h.t})).concat(CIRC.map(c=>({n:c.n,e:c.e,t:c.lvl+' · '+c.m.length+' metas'})));
  return [...mine,...own,...feed,...STORIES.map(s=>({n:s.n+' · exemplo',e:s.e,t:s.t}))];
}
/* monta um player em loop dentro de el; retorna {stop} */
function storyLoop(el,{ch='stories',dur=3200,onTV}={}){
  let items=loopItems(ch),i=0,t0=performance.now(),raf,alive=true;
  el.innerHTML=`<div class="sl-prog">${items.map(()=>'<i><b></b></i>').join('')}</div><span class="sl-live">● AO VIVO</span><div class="sl-stage" data-a></div><div class="sl-stage" data-b style="opacity:0"></div>`;
  let front=$('[data-a]',el),back=$('[data-b]',el);
  const paint=(st,it,k)=>{st.style.backgroundImage=it.url&&!it.video?`url(${it.url})`:it.url?'':SLG[k%SLG.length];st.innerHTML=`${it.video?`<video src="${it.url}" muted autoplay loop playsinline style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"></video>`:it.url?'':`<div class="pe">${it.e}</div>`}<div class="cap"><b>${esc(it.n)}</b>${esc(it.t||'')}</div>`};
  paint(front,items[0],0);
  const step=()=>{if(!alive||!el.isConnected){alive=false;return}
    const p=(performance.now()-t0)/dur;const bars=$$('.sl-prog b',el);bars.forEach((b,j)=>b.style.width=j<i?'100%':j===i?Math.min(100,p*100)+'%':'0');
    if(p>=1){i=(i+1)%items.length;if(i===0)bars.forEach(b=>b.style.width='0');paint(back,items[i],i);back.style.opacity=1;front.style.opacity=0;[front,back]=[back,front];t0=performance.now()}
    raf=requestAnimationFrame(step)};
  raf=requestAnimationFrame(step);
  return{stop(){alive=false;cancelAnimationFrame(raf)}};
}
let homeLoop=null;
function loopHidden(){try{return localStorage.getItem('appet-loop')==='off'}catch(e){return false}}
function setLoopHidden(v){try{localStorage.setItem('appet-loop',v?'off':'on')}catch(e){}}
function buildHomeLoop(){
  const box=$('#homeLoop');if(!box)return;homeLoop&&homeLoop.stop();
  if(loopHidden()){box.innerHTML='<button class="sl-show" id="slShow">▶ Mostrar stories da comunidade</button>';$('#slShow').onclick=()=>{setLoopHidden(false);buildHomeLoop()};return}

/* quadro de stories da tela inicial: arrastável, posição lembrada */
function dragHomeLoop(el){
  const place=(x,y)=>{el.classList.add('free');el.style.left=clamp(x,0,innerWidth-el.offsetWidth)+'px';el.style.top=clamp(y,0,innerHeight-el.offsetHeight)+'px'};
  try{const pos=JSON.parse(localStorage.getItem('appet-loop-pos')||'null');if(pos)requestAnimationFrame(()=>place(pos.x,pos.y))}catch(e){}
  let on=false,moved=false,sx,sy,ox,oy;
  el.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;const r=el.getBoundingClientRect();on=true;moved=false;sx=e.clientX;sy=e.clientY;ox=r.left;oy=r.top;el.setPointerCapture(e.pointerId)});
  el.addEventListener('pointermove',e=>{if(!on)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(!moved&&Math.hypot(dx,dy)<4)return;moved=true;el.classList.add('dragging');place(ox+dx,oy+dy)});
  const up=()=>{if(!on)return;on=false;el.classList.remove('dragging');if(moved){try{localStorage.setItem('appet-loop-pos',JSON.stringify({x:parseFloat(el.style.left),y:parseFloat(el.style.top)}))}catch(e){}}};
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
  el.addEventListener('dblclick',()=>{el.classList.remove('free');el.style.left=el.style.top='';try{localStorage.removeItem('appet-loop-pos')}catch(e){}});
}
addEventListener('resize',()=>{const el=$('.slwrap.free');if(el){el.style.left=clamp(parseFloat(el.style.left),0,innerWidth-el.offsetWidth)+'px';el.style.top=clamp(parseFloat(el.style.top),0,innerHeight-el.offsetHeight)+'px'}});

/* fixa a TV em coordenadas absolutas (sai do centro automático) */
function pinTV(tv){if(tv.dataset.pinned)return;const r=tv.getBoundingClientRect();tv.style.animation='none';tv.style.transform='none';tv.style.left=r.left+'px';tv.style.top=r.top+'px';tv.style.bottom='auto';tv.dataset.pinned=1}
let tvPrev=null;
function maxTV(){const tv=$('#tv');if(!tv)return;pinTV(tv);
  if(tv.classList.contains('big')){tv.classList.remove('big');tv.style.width=tvPrev.w;tv.style.left=tvPrev.l;tv.style.top=tvPrev.t;return}
  tvPrev={w:tv.style.width||'330px',l:tv.style.left,t:tv.style.top};
  const w=Math.max(330,Math.min(940,innerWidth*.9,(innerHeight-330)*4/3+110));
  tv.classList.add('big');tv.style.width=w+'px';tv.style.left=(innerWidth-w)/2+'px';tv.style.top='56px'}
function minTV(){const tv=$('#tv');if(!tv)return;tv.classList.add('min');setTimeout(()=>{tv.style.display='none';tv.classList.remove('min')},340)}
function tvHidden(){const tv=$('#tv');return tv&&tv.style.display==='none'}
function closeTV(){const tv=$('#tv');if(!tv)return;tvLoop&&tvLoop.stop();tv.classList.add('out');setTimeout(()=>tv.remove(),350);const b=$('#dock .dk[data-id="appetv"]');if(b)b.classList.remove('run')}
